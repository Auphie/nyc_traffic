version: 2

models:
  - name: stg_fhvhv_trips
    description: "Staging view for landed high-volume FHV trip parquet files, with canonical column names mapped from the TLC HVFHS trip data dictionary."
    columns:
      - name: source_file_name
        data_type: varchar
        description: "Original parquet file name read from the local landing zone."
      - name: source_month
        data_type: date
        description: "Month extracted from the TLC parquet file name."
      - name: service_type
        data_type: varchar
        description: "Logical TLC trip service category for this staging model."
      - name: hvfhs_license_num
        data_type: varchar
        description: "TLC license number of the high-volume FHV base or business."
      - name: dispatching_base_num
        data_type: varchar
        description: "TLC base license number of the base that dispatched the trip."
      - name: originating_base_num
        data_type: varchar
        description: "Base number of the base that received the original trip request."
      - name: requested_at
        data_type: timestamp
        description: "Date and time when the passenger requested pickup, mapped from `request_datetime`."
      - name: on_scene_at
        data_type: timestamp
        description: "Date and time when the driver arrived at the pickup location, mapped from `on_scene_datetime`."
      - name: pickup_at
        data_type: timestamp
        description: "Date and time of the trip pick-up, mapped from `pickup_datetime`."
        data_tests:
          - not_null
      - name: dropoff_at
        data_type: timestamp
        description: "Date and time of the trip drop-off, mapped from `dropoff_datetime`."
        data_tests:
          - not_null
      - name: pickup_location_id
        data_type: integer
        description: "TLC Taxi Zone identifier where the trip began, mapped from `PULocationID`."
      - name: dropoff_location_id
        data_type: integer
        description: "TLC Taxi Zone identifier where the trip ended, mapped from `DOLocationID`."
      - name: trip_miles
        data_type: double
        description: "Total passenger-trip miles."
      - name: trip_time_seconds
        data_type: bigint
        description: "Total passenger-trip time in seconds, mapped from `trip_time`."
      - name: base_passenger_fare
        data_type: double
        description: "Base passenger fare before tolls, tips, taxes, and fees."
      - name: tolls_amount
        data_type: double
        description: "Total amount of all tolls paid during the trip."
      - name: bcf_amount
        data_type: double
        description: "Total amount collected during the trip for the Black Car Fund."
      - name: sales_tax_amount
        data_type: double
        description: "Total amount collected during the trip for New York State sales tax."
      - name: congestion_surcharge
        data_type: double
        description: "Total amount collected during the trip for the New York State congestion surcharge."
      - name: airport_fee
        data_type: double
        description: "Airport fee charged for eligible pickup and drop-off trips at LaGuardia, Newark, and JFK."
      - name: tip_amount
        data_type: double
        description: "Total tips received from the passenger."
      - name: driver_pay_amount
        data_type: double
        description: "Total driver pay for the trip, excluding tolls and tips and net of commission, surcharges, or taxes."
      - name: shared_request_flag
        data_type: varchar
        description: "Y/N flag showing whether the passenger agreed to a shared or pooled ride, regardless of match outcome."
      - name: shared_match_flag
        data_type: varchar
        description: "Y/N flag showing whether the passenger shared the vehicle with another separately booked passenger at any point during the trip."
      - name: access_a_ride_flag
        data_type: varchar
        description: "Y/N flag showing whether the trip was administered on behalf of the Metropolitan Transportation Authority."
      - name: wav_request_flag
        data_type: varchar
        description: "Y/N flag showing whether the passenger requested a wheelchair-accessible vehicle."
      - name: wav_match_flag
        data_type: varchar
        description: "Y/N flag showing whether the trip occurred in a wheelchair-accessible vehicle."
      - name: cbd_congestion_fee
        data_type: double
        description: "Per-trip charge for the MTA Congestion Relief Zone, effective January 5, 2025."
